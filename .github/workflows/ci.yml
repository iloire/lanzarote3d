name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # .env is git-crypt encrypted and CI has no key, so it checks out as ciphertext
      - run: rm -f .env
      - run: npx jest --ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run build
      - run: npm run build:relax
