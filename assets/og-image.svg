<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2914"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>

  <!-- Volcanic terrain silhouette -->
  <path d="M0 500 Q100 420 200 450 Q350 380 450 420 Q550 350 650 400 Q750 320 850 380 Q950 300 1050 350 Q1150 280 1200 320 L1200 630 L0 630 Z" fill="url(#groundGradient)"/>

  <!-- Mountain peaks -->
  <path d="M300 450 L380 320 L460 450" fill="#2d1f0f" opacity="0.8"/>
  <path d="M700 400 L800 250 L900 400" fill="#2d1f0f" opacity="0.8"/>

  <!-- Paraglider 1 -->
  <g transform="translate(600, 200)">
    <ellipse cx="0" cy="0" rx="80" ry="25" fill="#e94560"/>
    <line x1="0" y1="25" x2="0" y2="70" stroke="#333" stroke-width="2"/>
    <ellipse cx="0" cy="75" rx="8" ry="15" fill="#333"/>
  </g>

  <!-- Paraglider 2 -->
  <g transform="translate(350, 280)">
    <ellipse cx="0" cy="0" rx="60" ry="18" fill="#f39c12"/>
    <line x1="0" y1="18" x2="0" y2="55" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="0" cy="60" rx="6" ry="12" fill="#333"/>
  </g>

  <!-- Paraglider 3 -->
  <g transform="translate(850, 160)">
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="#3498db"/>
    <line x1="0" y1="15" x2="0" y2="45" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="0" cy="50" rx="5" ry="10" fill="#333"/>
  </g>

  <!-- Text -->
  <text x="600" y="520" font-family="Ubuntu Mono, monospace" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">LANZAROTE PARAGLIDING</text>
  <text x="600" y="570" font-family="Ubuntu Mono, monospace" font-size="24" fill="#aaaaaa" text-anchor="middle">3D Flight Experience | Famara, Canary Islands</text>
</svg>
